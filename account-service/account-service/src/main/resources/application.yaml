server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3306/account_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # Secondary NoSQL Store (MongoDB)
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_transaction_logs


eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
    instance:
      prefer-ip-address: true


#langchain with groq API Key

langchain4j:
  open-ai:
    chat-model:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      model-name: openai/gpt-oss-120b
      temperature: 0.5
      log-requests: true
      log-responses: true